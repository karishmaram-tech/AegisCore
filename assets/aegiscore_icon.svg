<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AegisCore Icon</title>
  <desc>Sentinel Eye: A cybernetic eye scanning logo icon for AegisCore.</desc>
  <defs>
    <!-- Orange-Red Glowing Core Gradient -->
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff5a1f"/>
      <stop offset="75%" stop-color="#8a0000"/>
      <stop offset="100%" stop-color="#8a0000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Radar sweep (White/off-white with opacity) -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.25" />
  <circle cx="100" cy="100" r="64" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="16 4 2 4" opacity="0.4" />
  
  <!-- Curved HUD Brackets (White) -->
  <path d="M 44,68 A 52,52 0 0,0 44,132" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 156,68 A 52,52 0 0,1 156,132" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>

  <!-- Scanning crosshair ticks (Orange-Red highlights) -->
  <line x1="100" y1="12" x2="100" y2="24" stroke="#ff5a1f" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="100" y1="176" x2="100" y2="188" stroke="#ff5a1f" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="12" y1="100" x2="24" y2="100" stroke="#ff5a1f" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="176" y1="100" x2="188" y2="100" stroke="#ff5a1f" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Geometric Iris (Hexagon in White/Off-white) -->
  <polygon points="100,60 134.4,80 134.4,120 100,140 65.6,120 65.6,80" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <polygon points="100,68 127.6,84 127.6,116 100,132 72.4,116 72.4,84" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>

  <!-- Central Pupil Core (Orange-Red Glow) -->
  <circle cx="100" cy="100" r="20" fill="url(#pupilGlow)" filter="url(#neon)" />
  <circle cx="100" cy="100" r="6.4" fill="#ffffff" />
  
  <!-- Laser targeting beam (Orange-Red) -->
  <line x1="36" y1="100" x2="164" y2="100" stroke="#ff5a1f" stroke-width="0.8" opacity="0.6" />
  <circle cx="60" cy="100" r="1.2" fill="#ff5a1f" opacity="0.8"/>
  <circle cx="140" cy="100" r="1.2" fill="#ff5a1f" opacity="0.8"/>
</svg>
