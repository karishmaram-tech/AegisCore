<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AegisCore</title>
  <desc>A bolt mark on a soft teal, indigo and amber gradient card, beside the wordmark AegisCore and a tagline.</desc>
  <defs>
    <clipPath id="cardClip2">
      <rect x="0" y="0" width="220" height="220" rx="24"/>
    </clipPath>
    <filter id="soften2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <style>
      .word2 { fill: #14110f; }
      .tag2 { fill: #5b5750; }
      @media (prefers-color-scheme: dark) {
        .word2 { fill: #f5f3ee; }
        .tag2 { fill: #b7b2a9; }
      }
    </style>
  </defs>

  <g transform="translate(20,20)">
    <g clip-path="url(#cardClip2)">
      <rect x="0" y="0" width="220" height="220" fill="#f4f1ea"/>
      <g filter="url(#soften2)">
        <ellipse cx="30" cy="40" rx="85" ry="60" fill="#f6c453" opacity="0.85"/>
        <ellipse cx="180" cy="55" rx="88" ry="70" fill="#5ecfc0" opacity="0.85"/>
        <ellipse cx="55" cy="175" rx="90" ry="75" fill="#4f6df5" opacity="0.55"/>
        <ellipse cx="175" cy="180" rx="88" ry="70" fill="#7c3aed" opacity="0.5"/>
        <ellipse cx="110" cy="110" rx="65" ry="50" fill="#f4f1ea" opacity="0.35"/>
      </g>
    </g>
    <path d="M121 33 L79 125 L104 125 L93 187 L147 92 L119 92 Z" fill="#111111"/>
  </g>

  <text x="270" y="140" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" class="word2">AegisCore</text>
  <text x="272" y="175" font-family="Arial, Helvetica, sans-serif" font-size="20" class="tag2">Autonomous AI red team agent</text>
</svg>
