<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>AegisCore — animated Sentinel Eye logo</title>
  <desc>An animated logo on a baked-in black card: HUD brackets lock on, a scan ring draws and rotates, the core activates, a crosshair extends, and the AegisCore wordmark resolves, settling into an infinite idle pulse.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff8a3d"/>
      <stop offset="70%" stop-color="#ff2d2d"/>
      <stop offset="100%" stop-color="#8a0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff2d2d"/>
    </linearGradient>
    <linearGradient id="structGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff2d2d"/>
    </linearGradient>
    <style>
      @keyframes bracketIn {
        0%   { opacity: 0; transform: translate(var(--bx), var(--by)); }
        100% { opacity: 1; transform: translate(0, 0); }
      }
      @keyframes drawRing {
        0%   { stroke-dashoffset: 440; opacity: 0; }
        15%  { opacity: 1; }
        60%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes hexIn {
        0%   { opacity: 0; transform: scale(0.4); }
        55%  { opacity: 0; transform: scale(0.4); }
        80%  { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes coreIn {
        0%   { opacity: 0; transform: scale(0); }
        65%  { opacity: 0; transform: scale(0); }
        82%  { opacity: 1; transform: scale(1.4); }
        92%  { opacity: 1; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes corePulse {
        0%, 100% { filter: brightness(1); }
        50%      { filter: brightness(1.35); }
      }
      @keyframes crossExtend {
        0%   { transform: scaleX(0); opacity: 0; }
        100% { transform: scaleX(1); opacity: 1; }
      }
      @keyframes wordFade {
        0%   { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .bracket { transform-origin: 160px 160px; animation: bracketIn 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
      .b-tl { --bx: -18px; --by: -18px; }
      .b-tr { --bx: 18px;  --by: -18px; animation-delay: .08s; }
      .b-br { --bx: 18px;  --by: 18px;  animation-delay: .16s; }
      .b-bl { --bx: -18px; --by: 18px;  animation-delay: .24s; }

      .ringOuter {
        transform-origin: 160px 160px;
        stroke-dasharray: 6 10;
        opacity: 0;
        animation: drawRing 1.1s ease-out .35s forwards,
                   spinSlow 22s linear 1.5s infinite;
      }
      .ringInner {
        transform-origin: 160px 160px;
        stroke-dasharray: 440;
        animation: drawRing 1s ease-out .5s forwards;
      }
      .hex { transform-origin: 160px 160px; animation: hexIn .55s ease-out .75s forwards; }
      .core {
        transform-origin: 160px 160px;
        animation: coreIn .5s ease-out 1.05s forwards,
                   corePulse 2.6s ease-in-out 1.6s infinite;
      }
      .crossH { transform-origin: 160px 160px; animation: crossExtend .5s ease-out 1.2s forwards; }
      .crossV { transform-origin: 160px 160px; animation: crossExtend .5s ease-out 1.2s forwards; }

      .word { opacity: 0; animation: wordFade .6s ease-out 1.5s forwards; }
      .tag  { opacity: 0; animation: wordFade .6s ease-out 1.7s forwards; }
    </style>
  </defs>

  <!-- Baked-in Black Rounded Card Background -->
  <rect width="900" height="320" rx="16" fill="#080a0f"/>

  <!-- HUD corner brackets (recolored to red/orange-red) -->
  <g stroke="#ff2d2d" stroke-width="3" fill="none" stroke-linecap="round">
    <path class="bracket b-tl" d="M 90 100 L 68 100 L 68 122"/>
    <path class="bracket b-tr" d="M 230 100 L 252 100 L 252 122"/>
    <path class="bracket b-br" d="M 230 220 L 252 220 L 252 198"/>
    <path class="bracket b-bl" d="M 90 220 L 68 220 L 68 198"/>
  </g>

  <!-- outer dashed scan ring (orange-red, opacity 0.5) -->
  <circle class="ringOuter" cx="160" cy="160" r="92" fill="none" stroke="#ff8a3d" stroke-width="2.5" opacity="0.5"/>

  <!-- inner solid ring (partial, HUD style, red) -->
  <circle class="ringInner" cx="160" cy="160" r="70" fill="none" stroke="#ff2d2d" stroke-width="2.5"/>

  <!-- hexagon iris (orange-red) -->
  <polygon class="hex" points="160,105 205,132.5 205,187.5 160,215 115,187.5 115,132.5"
           fill="none" stroke="url(#structGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- crosshair (orange-red) -->
  <line class="crossH" x1="70" y1="160" x2="250" y2="160" stroke="#ff8a3d" stroke-width="2"/>
  <line class="crossV" x1="160" y1="70" x2="160" y2="250" stroke="#ff8a3d" stroke-width="2" opacity="0"/>

  <!-- glowing core -->
  <circle class="core" cx="160" cy="160" r="38" fill="url(#coreGlow)"/>
  <circle class="core" cx="160" cy="160" r="10" fill="#ffffff"/>

  <!-- wordmark (Aegis in bright light peach-red #ffd6c2, Core in orange-red gradient) -->
  <text class="word" x="320" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#ffd6c2">Aegis</tspan><tspan fill="url(#wordGrad)">Core</tspan>
  </text>
  <!-- Tagline (warm cyber-grey) -->
  <text class="tag" x="322" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#a38c86" letter-spacing="4">
    AUTONOMOUS AI RED TEAM AGENT
  </text>
</svg>
